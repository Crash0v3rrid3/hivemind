[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hivemind-app"
version = "0.1.0"
description = "Hivemind — serverless, append-only, semantically-searchable shared team memory over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BrowserStack" }]
dependencies = [
    # Pin to the 1.x SDK: the 2.0 release restructured the package and removed
    # mcp.server.fastmcp (the FastMCP API this app uses).
    "mcp>=1.2.0,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3.0",
    "pydantic>=2.6",
    "structlog>=24.1",
]

[project.optional-dependencies]
# The real embedder (fastembed -> onnxruntime, torch-free) is only needed in
# production. Install with `pip install .[embeddings]`. For tests/CI, omit it and
# set EMBEDDING_MODEL=fake to use the deterministic FakeEmbedder (no fastembed, no
# downloads). Keeping it optional keeps the test image and CI env small.
embeddings = [
    "fastembed>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "asgi-lifespan>=2.1",
    "httpx>=0.27",
]

[project.scripts]
hivemind-app = "hivemind_app.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["hivemind_app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
# FastMCP's @mcp.tool() decorators are untyped; the tool functions themselves
# are fully annotated. Allow untyped decorators so strict mode does not flag them.
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = [
    "fastembed.*",
    "onnxruntime.*",
    "pgvector.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a live Postgres (skipped when unavailable)",
]
filterwarnings = [
    # Upstream (not our code): mcp's FastMCP Settings is a pydantic-settings model
    # whose `lifespan` field has an unresolved forward reference. Benign; emitted
    # from the pinned mcp SDK (mcp>=1.2,<2). Fires from a bare FastMCP() with none
    # of our code loaded, so silence it to keep the suite output clean.
    "ignore:Field 'lifespan' has an incomplete definition",
]
