# Hivemind — PRODUCTION stack (per developer node).
#
# This file is the RCLONE-backend reference: three services — the rclone Google
# Drive FUSE mount, Postgres (pgvector), and the app. Each developer runs it with
# THEIR OWN Drive credentials so Drive enforces per-folder write scoping
# (authorship = the folder a record sits in).
#
# MOUNT BACKENDS: `hivemind setup` generates the concrete per-node stack from
# ~/.hivemind.conf based on `mount_backend`:
#   - rclone         -> this three-service shape (needs a Drive OAuth token).
#   - gdrive_desktop -> DROPS the `gdrive` service; Google Drive for Desktop syncs
#                       the folder and the `app` bind-mounts `gdrive_desktop_path`
#                       -> /mnt/hivemind directly (no rclone, no OAuth). See cli/generate.ts.
#
#   `hivemind setup` generates a concrete, value-baked copy of this stack into
#   ~/.hivemind/docker-compose.yml (from cli/templates). This root file is the
#   canonical/maintained reference and is usable directly with a populated .env:
#
#   docker-compose --env-file ~/.hivemind/.env -f docker-compose.prod.yml up -d
#
# Requires (in .env / the environment): OWNER_HANDLE, MCP_PORT, RCLONE_REMOTE,
# HIVEMIND_DRIVE_PATH, and ~/.hivemind/rclone.conf holding this user's OAuth token.
# The test stack (no Drive) lives in docker-compose.test.yml.
name: hivemind

services:
  gdrive:
    image: rclone/rclone:latest
    cap_add: [SYS_ADMIN]
    devices: ["/dev/fuse"]
    security_opt: ["apparmor:unconfined"]
    restart: unless-stopped
    volumes:
      # Run this stack from ~/.hivemind (where `hivemind setup` writes rclone.conf
      # and .env), or set HIVEMIND_DIR to that directory.
      - ${HIVEMIND_DIR:-.}/rclone.conf:/config/rclone/rclone.conf:ro
      - type: bind
        source: ${HIVEMIND_MOUNT_PATH:-/mnt/hivemind}
        target: /mnt/hivemind
        bind:
          propagation: rshared # propagate the FUSE mount to the app container
    command: >
      mount ${RCLONE_REMOTE:-hivemind}:${HIVEMIND_DRIVE_PATH:-hivemind} /mnt/hivemind
      --allow-other --vfs-cache-mode writes --dir-cache-time 10s --poll-interval 15s
    healthcheck:
      test: ["CMD-SHELL", "test -d /mnt/hivemind/${OWNER_HANDLE}"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: hivemind
      POSTGRES_DB: hivemind
    volumes:
      - pgdata:/var/lib/postgresql/data # LOCAL volume — never on the Drive mount
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind -d hivemind"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # Prefer the published image once available; build locally for prod-test.
    # image: hivemind:${IMAGE_TAG:-0.1.0}
    build:
      context: ./app
      args:
        INSTALL_EMBEDDINGS: "1" # bake the real BAAI embedder (torch) for prod
    restart: unless-stopped
    depends_on:
      gdrive:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - path: ${HIVEMIND_DIR:-.}/.env
        required: false # generated by `hivemind setup`; absent until then
    ports:
      - "127.0.0.1:${MCP_PORT:-7777}:${MCP_PORT:-7777}"
    volumes:
      - type: bind
        source: ${HIVEMIND_MOUNT_PATH:-/mnt/hivemind}
        target: /mnt/hivemind
        bind:
          propagation: rslave # sees the FUSE mount created by the gdrive service

volumes:
  pgdata:
