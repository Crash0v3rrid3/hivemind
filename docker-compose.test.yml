# Hivemind — LOCAL TEST stack (no Google Drive).
#
# Postgres (pgvector) + the app, with a LOCAL host folder standing in for the
# Drive FUSE mount and deterministic FAKE embeddings (EMBEDDING_MODEL=fake), so
# nothing needs torch, a model download, rclone, or Drive credentials.
#
#   docker-compose -f docker-compose.test.yml up --build      # full app round-trip
#   docker-compose -f docker-compose.test.yml up -d postgres  # DB only, for pytest:
#       DATABASE_URL_TEST=postgresql+asyncpg://hivemind:hivemind@localhost:5433/hivemind \
#           make -C app test-integration   # (or: pytest -m integration)
#   docker-compose -f docker-compose.test.yml down -v
#
# The prod stack (with the gdrive FUSE mount) lives in docker-compose.prod.yml.
name: hivemind-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: hivemind
      POSTGRES_DB: hivemind
    ports:
      # exposed for host-run pytest integration (DATABASE_URL_TEST). Override the
      # host port if 5433 is taken: PG_HOST_PORT=5434 docker-compose ...
      - "${PG_HOST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data # in-memory: fast + disposable for tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind -d hivemind"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ./app # default build is torch-free (INSTALL_EMBEDDINGS=0)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OWNER_HANDLE: ${OWNER_HANDLE:-localdev}
      ROSTER: ${ROSTER:-localdev}
      HIVEMIND_PATH: /mnt/hivemind
      DATABASE_URL: postgresql+asyncpg://hivemind:hivemind@postgres:5432/hivemind
      EMBEDDING_MODEL: fake # deterministic FakeEmbedder — no torch / no downloads
      EMBEDDING_DIM: "384"
      EXPORT_INTERVAL_SEC: "5"
      IMPORT_INTERVAL_SEC: "5"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "7777"
    ports:
      - "${HOST_MCP_PORT:-7830}:7777" # host 7830 by default (avoids a local :7777)
    volumes:
      - ./.hive:/mnt/hivemind # local folder stands in for the Drive FUSE mount
