name: CI & Release

# - Pull requests: run `make check` (unit layer) + a macOS Nix flake build.
# - Tag push (v*): publish the CLI to npm.

on:
  pull_request:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI — runs on every pull request (and on tags, as a gate before release).
  # ---------------------------------------------------------------------------
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit checks for both packages
        run: make check

  # ---------------------------------------------------------------------------
  # Nix flake build (macOS) — validates the default `deploy_backend=nix` runtime
  # surface: the app package + the process-compose `up` lifecycle app build.
  # ---------------------------------------------------------------------------
  nix-build:
    name: Nix flake build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (flakes enabled)
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the app flake (fake package + up lifecycle)
        run: |
          nix build ./app#app-fake -L
          nix build ./app#up -L

  # ---------------------------------------------------------------------------
  # Publish the CLI (hivemind) to npm — tag only.
  # ---------------------------------------------------------------------------
  publish-cli:
    name: Publish CLI to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

