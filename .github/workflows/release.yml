name: CI & Release

# - Pull requests: run `make check` (unit layer) + a macOS Nix flake build.
# - Tag push (v*): publish the CLI to GitHub Packages.

on:
  pull_request:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI — runs on every pull request (and on tags, as a gate before release).
  # ---------------------------------------------------------------------------
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit checks for both packages
        run: make check

  # ---------------------------------------------------------------------------
  # Nix flake build (macOS) — validates the default `deploy_backend=nix` runtime
  # surface: the app package + the process-compose `up` lifecycle app build.
  # ---------------------------------------------------------------------------
  nix-build:
    name: Nix flake build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pin supported OS labels for both architectures; macos-13 is retired.
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (flakes enabled)
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build both embedding runtime variants
        run: |
          nix build ./app#app-fake -L
          nix build ./app#up-fake -L
          nix build ./app#up-real -L

  # ---------------------------------------------------------------------------
  # Postgres integration tests — exercises the DEFAULT persistence backend
  # (Postgres 16 + pgvector) end to end: schema init, append-only CRUD, search.
  # These are skipped by `make check`, so without this job the default backend
  # has zero CI coverage.
  # ---------------------------------------------------------------------------
  integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hivemind
          POSTGRES_PASSWORD: hivemind
          POSTGRES_DB: hivemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hivemind -d hivemind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app (with dev tooling)
        run: python -m pip install -e "./app[dev]"

      - name: Run Postgres integration tests
        env:
          DATABASE_URL_TEST: postgresql+asyncpg://hivemind:hivemind@localhost:5432/hivemind
        run: cd app && python -m pytest -m integration -v

  # ---------------------------------------------------------------------------
  # Publish the CLI (hivemind) to GitHub Packages — tag only.
  # ---------------------------------------------------------------------------
  publish-cli:
    name: Publish CLI to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, integration, nix-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@crash0v3rrid3"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

